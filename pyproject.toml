[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koji-sbom"
version = "0.1.1"
description = "Metadata-only RPM SPDX SBOM generation from Koji hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
koji-sbom = "koji_sbom.generate:main"
koji-sbom-generate = "koji_sbom.generate:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
]

[tool.setuptools]
packages = ["koji_sbom"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["koji_sbom", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N803", "N806", "N816"]

[tool.pytest.ini_options]
testpaths = ["tests"]
