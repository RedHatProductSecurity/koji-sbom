name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python, rpm bindings, and tools
        run: |
          dnf install -y python3 python3-pip python3-rpm
          python3 --version
          python3 -c "import rpm; print(rpm.__file__)"
      - name: Install package and dev dependencies
        run: python3 -m pip install -e ".[dev]"
      - name: Check formatting
        run: python3 -m ruff format --check koji_sbom/ tests/
      - name: Lint
        run: python3 -m ruff check koji_sbom/ tests/
      - name: Run tests
        run: python3 -m pytest tests/ -v --tb=short
